<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1200" fill="none">
  <defs>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffdfb"/>
      <stop offset=".48" stop-color="#f8dfe0"/>
      <stop offset="1" stop-color="#e8bfc0"/>
    </linearGradient>
    <linearGradient id="petalLight" x1="0" y1="0" x2="1" y2=".8">
      <stop stop-color="#fff"/>
      <stop offset=".7" stop-color="#f8e9e3"/>
      <stop offset="1" stop-color="#e9c8be"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b5c29b"/>
      <stop offset=".5" stop-color="#81936d"/>
      <stop offset="1" stop-color="#596d53"/>
    </linearGradient>
    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d7d8b7"/>
      <stop offset="1" stop-color="#91a17a"/>
    </linearGradient>
    <radialGradient id="center">
      <stop stop-color="#f4d79b"/>
      <stop offset=".58" stop-color="#b17b50"/>
      <stop offset="1" stop-color="#795542"/>
    </radialGradient>
    <filter id="soft" x="-.2" y="-.2" width="1.4" height="1.4">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <g id="blossom">
      <g fill="url(#petal)" stroke="#dcaeaa" stroke-opacity=".28" stroke-width="2">
        <ellipse cy="-54" rx="33" ry="61"/>
        <ellipse cy="-54" rx="33" ry="61" transform="rotate(72)"/>
        <ellipse cy="-54" rx="33" ry="61" transform="rotate(144)"/>
        <ellipse cy="-54" rx="33" ry="61" transform="rotate(216)"/>
        <ellipse cy="-54" rx="33" ry="61" transform="rotate(288)"/>
      </g>
      <circle r="20" fill="url(#center)"/>
      <g fill="#efcf8d" opacity=".85">
        <circle cx="-13" cy="-2" r="2.4"/><circle cx="-7" cy="-12" r="2.2"/>
        <circle cx="4" cy="-14" r="2.3"/><circle cx="13" cy="-7" r="2.5"/>
        <circle cx="14" cy="5" r="2.2"/><circle cx="5" cy="13" r="2.4"/>
        <circle cx="-6" cy="12" r="2.3"/><circle cx="-14" cy="6" r="2"/>
      </g>
    </g>
    <g id="leafShape">
      <path d="M0 0C34-45 88-52 115-35C94 8 45 30 0 0Z" fill="url(#leaf)"/>
      <path d="M4-1C41-9 77-24 108-34" stroke="#e8e2c9" stroke-opacity=".48" stroke-width="2"/>
    </g>
    <g id="sprig" stroke="#766044" stroke-width="5" stroke-linecap="round">
      <path d="M0 250C55 185 58 115 5 0" fill="none"/>
      <path d="M16 213C-29 198-57 161-53 126C-16 133 13 165 16 213Z" fill="url(#leafLight)" stroke="none"/>
      <path d="M35 170C77 151 98 112 91 78C55 88 29 122 35 170Z" fill="url(#leaf)" stroke="none"/>
      <path d="M42 115C4 98-14 63-5 32C29 43 49 74 42 115Z" fill="url(#leafLight)" stroke="none"/>
      <path d="M48 76C82 55 91 22 78-5C49 12 36 42 48 76Z" fill="url(#leaf)" stroke="none"/>
    </g>
  </defs>

  <!-- soft botanical washes leave the reading area open -->
  <g opacity=".2" filter="url(#soft)">
    <circle cx="100" cy="100" r="230" fill="#f3d6d5"/>
    <circle cx="1340" cy="670" r="250" fill="#eadfc9"/>
  </g>
  <g opacity=".58">
    <g transform="translate(75 145) rotate(-18)"><use href="#sprig"/></g>
    <g transform="translate(1260 45) rotate(143) scale(1.15)"><use href="#sprig"/></g>
    <g transform="translate(1350 800) rotate(15) scale(1.1)"><use href="#sprig"/></g>
    <g transform="translate(40 990) rotate(-112) scale(.95)"><use href="#sprig"/></g>
  </g>
  <g opacity=".56">
    <g transform="translate(245 115) rotate(-10) scale(1.08)"><use href="#blossom"/></g>
    <g transform="translate(1322 250) rotate(15) scale(.84)"><use href="#blossom"/></g>
    <g transform="translate(119 760) rotate(-8) scale(.7)"><use href="#blossom"/></g>
    <g transform="translate(1310 1080) rotate(12) scale(1.05)"><use href="#blossom"/></g>
  </g>
  <g opacity=".38">
    <g transform="translate(100 255) rotate(34)"><use href="#leafShape"/></g>
    <g transform="translate(1150 410) rotate(208) scale(.8)"><use href="#leafShape"/></g>
    <g transform="translate(270 945) rotate(20) scale(.9)"><use href="#leafShape"/></g>
    <g transform="translate(1180 900) rotate(190)"><use href="#leafShape"/></g>
  </g>
</svg>
